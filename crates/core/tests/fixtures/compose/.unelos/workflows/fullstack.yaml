name: fullstack
start: plan
nodes:
  plan:
    taskDefinition: {instructions: Plan the work.}
    outputs: [plan.md]
    next: frontend
  frontend:
    type: workflow
    workflow: react-component
    inputs: {brief.md: plan.md}
    outputs: {report.md: frontend-report.md}
    next: {done: review, abandoned: plan}
  review:
    type: human-gate
    inputs: [frontend-report.md]
    next: {approved: end, rejected: frontend}
  end: {type: end}
