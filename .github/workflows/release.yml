name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "Windows"
            platform: "windows-latest"
            args: "--bundles nsis"
            rustTargets: ""
            assetPattern: "[name]-[version]-[platform]-[arch][setup][ext]"
            uploadPlainBinary: false
            portableUpload: true
          - name: "macOS Apple Silicon"
            platform: "macos-latest"
            args: "--target aarch64-apple-darwin --bundles dmg"
            rustTargets: "aarch64-apple-darwin"
            assetPattern: "[name]-[version]-[platform]-[arch][setup][ext]"
            uploadPlainBinary: false
            portableUpload: false
          - name: "macOS Intel"
            platform: "macos-latest"
            args: "--target x86_64-apple-darwin --bundles dmg"
            rustTargets: "x86_64-apple-darwin"
            assetPattern: "[name]-[version]-[platform]-[arch][setup][ext]"
            uploadPlainBinary: false
            portableUpload: false
          - name: "Linux"
            platform: "ubuntu-22.04"
            args: "--bundles appimage,deb"
            rustTargets: ""
            assetPattern: "[name]-[version]-[platform]-[arch][setup][ext]"
            uploadPlainBinary: false
            portableUpload: false
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rustTargets }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and publish
        id: tauri
        uses: tauri-apps/tauri-action@action-v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: ${{ startsWith(matrix.platform, 'macos-') && '-' || '' }}
        with:
          tagName: v__VERSION__
          releaseName: v__VERSION__
          releaseBody: |
            See the assets below to download this version.
            The Windows portable zip requires the Microsoft Edge WebView2 Runtime.
          releaseDraft: true
          prerelease: false
          generateReleaseNotes: true
          retryAttempts: 2
          args: ${{ matrix.args }}
          assetNamePattern: ${{ matrix.assetPattern }}
          uploadPlainBinary: ${{ matrix.uploadPlainBinary }}
          includeUpdaterJson: false

      - name: Upload Windows portable executable
        if: matrix.portableUpload
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $config = Get-Content "src-tauri/tauri.conf.json" | ConvertFrom-Json
          $metadata = cargo metadata --manifest-path "src-tauri/Cargo.toml" --no-deps --format-version 1 | ConvertFrom-Json
          $binaryPath = Join-Path $metadata.target_directory "release/$($config.mainBinaryName).exe"
          # The GUI provisions harnesses from a sibling unelos.exe, so the portable build must ship both.
          $cliPath = Join-Path $metadata.target_directory "release/unelos.exe"
          foreach ($path in @($binaryPath, $cliPath)) {
            if (-not (Test-Path -LiteralPath $path)) {
              throw "Portable executable was not found at $path."
            }
          }

          $safeProductName = ($config.productName -replace '[^A-Za-z0-9._-]+', '-').Trim('-')
          $version = "${{ steps.tauri.outputs.appVersion }}"
          $assetName = "$safeProductName-$version-windows-x64-portable.zip"
          $assetPath = Join-Path $env:RUNNER_TEMP $assetName

          Compress-Archive -LiteralPath $binaryPath, $cliPath -DestinationPath $assetPath
          gh release upload "v$version" $assetPath --clobber

      - name: Release summary
        if: steps.tauri.outputs.releaseHtmlUrl != ''
        shell: bash
        run: |
          {
            echo "## Tauri Release"
            echo ""
            echo "- Platform: \`${{ matrix.name }}\`"
            echo "- Version: \`${{ steps.tauri.outputs.appVersion }}\`"
            echo "- Release: ${{ steps.tauri.outputs.releaseHtmlUrl }}"
            echo "- Artifacts: \`${{ steps.tauri.outputs.artifactPaths }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
