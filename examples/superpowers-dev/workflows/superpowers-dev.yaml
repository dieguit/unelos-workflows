name: superpowers-dev
description: Brainstorm a spec, approve a plan, execute it task-by-task with review, then finish the branch.
start: brainstorm
nodes:
  brainstorm:
    taskDefinition:
      skills: [brainstorming]
      instructions: |
        Ask what needs to be done if the request is not clear, then follow the
        brainstorming skill with the user until the design is agreed. Write it to
        the bound spec.md and self-review it. On re-entry after gate rejection,
        revise spec.md in place from the feedback. Conversation approval is not
        gate approval.
    agent: sp-controller
    execution: main
    outputs: [spec.md]
    next: approve-spec
  approve-spec:
    type: human-gate
    inputs: [spec.md]
    next:
      approved: write-plan
      rejected: brainstorm
  write-plan:
    taskDefinition:
      skills: [writing-plans]
      instructions: |
        Read spec.md, project instructions and relevant code. Follow the
        writing-plans skill to write the bound plan.md and self-review it against
        the spec. On re-entry after gate rejection, revise plan.md in place from
        the feedback. Do not implement.
    agent: sp-controller
    execution: main
    inputs: [spec.md]
    outputs: [plan.md]
    next: approve-plan
  approve-plan:
    type: human-gate
    inputs: [spec.md, plan.md]
    next:
      approved: setup-worktree
      rejected: write-plan
  setup-worktree:
    taskDefinition:
      skills: [using-git-worktrees, sdd-controller]
      instructions: |
        Create or verify the isolated worktree with a green baseline, run the
        preflight scan of plan.md, and write worktree.md as the skills describe.
    agent: sp-controller
    execution: main
    inputs: [spec.md, plan.md]
    outputs: [worktree.md]
    next: implement-task
  implement-task:
    taskDefinition:
      instructions: |
        Implement one plan task or one fix round in the worktree from worktree.md.
        Your assignment is in transition feedback progress.md (Current task, Open
        findings and Carry forward, whose rulings bind over the plan text); with no
        progress.md feedback, implement Task 1. Append your
        section to the bound implementation report.
    agent: sp-implementer
    execution: subagent
    inputs: [spec.md, plan.md, worktree.md]
    outputs: [implementation-report.md]
    next: review-task
  review-task:
    taskDefinition:
      instructions: |
        Review the latest section of implementation-report.md: a task section gets
        a full task review, a fix-round section gets a scoped re-review. Append
        your section to the bound review.
    agent: sp-task-reviewer
    execution: subagent
    inputs: [spec.md, plan.md, worktree.md, implementation-report.md]
    outputs: [review.md]
    next: advance
  advance:
    taskDefinition:
      skills: [sdd-controller]
      outcomes: [fix, next_task, all_done]
      instructions: |
        Apply the sdd-controller node map for advance: update the bound
        progress.md from the latest review section and choose exactly one outcome.
    agent: sp-controller
    execution: main
    inputs: [spec.md, plan.md, worktree.md, implementation-report.md, review.md]
    outputs: [progress.md]
    next:
      fix: implement-task
      next_task: implement-task
      all_done: final-review
  final-review:
    taskDefinition:
      instructions: |
        Review the whole branch from the merge-base in worktree.md and triage the
        deferred and parked lines in progress.md. When transition feedback carries
        final-fix-report.md, append a scoped re-review of the fix wave instead.
    agent: sp-final-reviewer
    execution: subagent
    inputs: [spec.md, plan.md, worktree.md, implementation-report.md, review.md, progress.md]
    outputs: [final-review.md]
    next: advance-final
  advance-final:
    taskDefinition:
      skills: [sdd-controller]
      outcomes: [final_fix, finish]
      instructions: |
        Apply the sdd-controller node map for advance-final: choose final_fix or
        finish from final-review.md and write residual rulings to final-rulings.md.
    agent: sp-controller
    execution: main
    inputs: [progress.md, final-review.md]
    outputs: [final-rulings.md]
    next:
      final_fix: fix-final
      finish: finish
  fix-final:
    taskDefinition:
      instructions: |
        Fix every must-fix finding in final-review.md in one wave, in the worktree
        from worktree.md. Write the bound report under a Final fix wave heading
        with BASE and HEAD and test evidence.
    agent: sp-implementer
    execution: subagent
    inputs: [spec.md, plan.md, worktree.md, final-review.md]
    outputs: [final-fix-report.md]
    next: final-review
  finish:
    taskDefinition:
      skills: [finishing-a-development-branch]
      instructions: |
        Follow the finishing-a-development-branch skill: verify, list the rulings,
        let the user choose merge, PR, keep or discard, carry it out, and write the
        bound finish.md.
    agent: sp-controller
    execution: main
    inputs: [spec.md, plan.md, worktree.md, progress.md, final-review.md, final-rulings.md]
    outputs: [finish.md]
    next: done
  done:
    type: end
