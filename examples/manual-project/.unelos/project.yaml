taskDefinitions:
  create-plan:
    instructions: Write a plan for the supplied request to its output path.
    skills: [planning]
  implement-plan:
    instructions: Implement the supplied plan and report verification.
    skills: [verification]
  review-implementation:
    instructions: Inspect actual changes against the plan and report findings.
    skills: [code-review, verification]
    outcomes: [approved, changes_requested]
  research-backend:
    instructions: Read the supplied plan and update the backend research report, preserving relevant existing content. Report changes to the controller.
    skills: [backend-research]
  research-frontend:
    instructions: Read the supplied plan and update the frontend research report, preserving relevant existing content. Report changes to the controller.
    skills: [frontend-research]
agents:
  planner:
    instructions: Follow project constraints when planning.
    skills: []
  engineer:
    instructions: Follow existing project conventions.
    skills: [rust]
    model: example-provider/example-model
    mcps: [github]
    tools: [read-file, run-command]
  reviewer:
    instructions: Inspect requirements and actual changes independently.
    skills: [rust]
  backend-researcher:
    instructions: Research backend concerns without editing the run ledger.
    skills: [backend-research]
    tools: [read-file]
  frontend-researcher:
    instructions: Research frontend concerns without editing the run ledger.
    skills: [frontend-research]
    tools: [read-file]
