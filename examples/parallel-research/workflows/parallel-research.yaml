name: parallel-research
description: Agree a research question, research backend and frontend in parallel, synthesize, then approve.
start: scope
nodes:
  scope:
    taskDefinition:
      instructions: |
        Interview the user until the research question, the backend and frontend
        areas to cover, and any choice deliberately left for researchers to ask
        about are agreed. Write them to the bound brief.md. On re-entry, update
        brief.md in place.
    agent: research-lead
    execution: main
    outputs: [brief.md]
    next: parallel-research
  parallel-research:
    type: parallel
    inputs: [brief.md]
    tasks:
      - taskDefinition:
          instructions: |
            Research the backend side of the question in brief.md. Write findings
            with file references to your supplied report. On re-entry, read the
            feedback and your existing report, then update it in place.
        agent: backend-researcher
      - taskDefinition:
          instructions: |
            Research the frontend side of the question in brief.md. Write findings
            with file references to your supplied report. On re-entry, read the
            feedback and your existing report, then update it in place.
        agent: frontend-researcher
    outputs: [research-summary.md]
    next: synthesis
  synthesis:
    taskDefinition:
      instructions: |
        Read brief.md and research-summary.md (follow its report links). Write a
        short answer to the research question, open risks and recommended next
        step to the bound synthesis.md. On re-entry, update it in place.
    agent: research-lead
    execution: main
    inputs: [brief.md, research-summary.md]
    outputs: [synthesis.md]
    next: approve-research
  approve-research:
    type: human-gate
    inputs: [synthesis.md, research-summary.md]
    next:
      approved: done
      rejected: parallel-research
  done:
    type: end
