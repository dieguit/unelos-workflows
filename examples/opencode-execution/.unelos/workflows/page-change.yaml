name: page-change
start: interview
nodes:
  interview:
    task: t16-interview
    agent: t16-controller
    execution: main
    outputs: [requirements.md]
    next: plan
  plan:
    task: t16-plan
    agent: t16-controller
    execution: main
    inputs: [requirements.md]
    outputs: [plan.md]
    next: approve-plan
  approve-plan:
    type: human-gate
    inputs: [requirements.md, plan.md]
    next:
      approved: implement
      rejected: plan
  implement:
    task: t16-implement
    agent: t16-engineer
    execution: subagent
    inputs: [requirements.md, plan.md]
    outputs: [implementation-report.md]
    next: review
  review:
    task: t16-review
    agent: t16-reviewer
    execution: subagent
    inputs: [requirements.md, plan.md, implementation-report.md]
    outputs: [review.md]
    next:
      passed: finish
      changes_requested: implement
  finish:
    type: end
