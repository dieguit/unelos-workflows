name: check-guide
start: outline
nodes:
  outline:
    task: outline-guide
    agent: writer
    execution: main
    outputs: [outline.md]
    next: review
  review:
    task: review-guide
    agent: reviewer
    execution: subagent
    inputs: [outline.md]
    outputs: [review.md]
    next: done
  done:
    type: end
