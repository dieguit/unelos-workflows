name: ui-bugfix
description: Reproduce a UI bug in the browser, fix the root cause, run checks, verify the fix with the same repro, then approve.
start: intake
nodes:
  intake:
    taskDefinition:
      instructions: |
        Get the bug from the user: what is wrong, where (screen or route), steps,
        expected behaviour, and screenshots if any. Ask only for what is missing.
        Write the bound bug.md. On re-entry, read the feedback (what the
        reproduction tried, or the user's extra details) and update bug.md in place.
    agent: dev-lead
    execution: main
    outputs: [bug.md]
    next: reproduce
  reproduce:
    task: ui-reproduce
    agent: ui-qa
    execution: subagent
    inputs: [bug.md]
    outputs: [repro.md]
    next:
      reproduced: fix
      not-reproduced: confirm-bug
      blocked: confirm-bug
  confirm-bug:
    type: human-gate
    inputs: [bug.md, repro.md]
    next:
      approved: fix
      rejected: intake
  fix:
    taskDefinition:
      outcomes: [ui-only, rust-touched]
      instructions: |
        Fix the bug described in bug.md and reproduced in repro.md, including
        every affected screen listed in its Scope section. When repro.md says the
        bug was not reproduced, rely on bug.md and the gate feedback. On re-entry,
        transition feedback carries the failing report (checks, verification or
        gate feedback): fix what it reports.

        Append a section to the bound fix.md: root cause, files changed, tests
        added, and what you ran. Choose rust-touched if any .rs file changed on
        this fix, else ui-only.
    agent: ui-fixer
    execution: subagent
    inputs: [bug.md, repro.md]
    outputs: [fix.md]
    next:
      ui-only: frontend-checks
      rust-touched: rust-checks
  rust-checks:
    task: rust-checks
    agent: check-runner
    execution: subagent
    outputs: [rust-checks.md]
    next:
      pass: frontend-checks
      fail: fix
  frontend-checks:
    task: frontend-checks
    agent: check-runner
    execution: subagent
    outputs: [frontend-checks.md]
    next:
      pass: verify
      fail: fix
  verify:
    task: ui-verify
    agent: ui-qa
    execution: subagent
    inputs: [bug.md, repro.md, fix.md]
    outputs: [ui-verification.md]
    next:
      pass: approve
      fail: fix
      blocked: approve
  approve:
    type: human-gate
    inputs: [repro.md, fix.md, ui-verification.md]
    next:
      approved: summarize
      rejected: fix
  summarize:
    taskDefinition:
      instructions: |
        Write the bound summary.md for the pull request: the bug, its root cause,
        the fix, the screens affected, and how it was verified (repro replayed,
        checks).
    agent: dev-lead
    execution: main
    inputs: [bug.md, repro.md, fix.md, ui-verification.md]
    outputs: [summary.md]
    next: pr
  pr:
    type: workflow
    workflow: pr-and-ci
    inputs: {summary.md: summary.md}
    next:
      green: done
      abandoned: done
  done:
    type: end
